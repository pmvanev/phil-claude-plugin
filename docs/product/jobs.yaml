# Validated Jobs-to-be-Done (SSOT)
# Bootstrapped by DISCUSS wave, feature: refactor-tests (2026-07-01)

jobs:
  - id: keep-test-suite-trustworthy
    job_story: >
      When my test suite has accumulated smells after a stretch of feature work,
      I want to systematically clean the test code up to my testing.md standards
      without silently weakening what the tests verify, so I can keep trusting the
      suite as a safety net and stop dreading test maintenance.
    dimensions:
      functional: >
        Bring test code into line with testing.md structure standards — AAA layout,
        intention-revealing names, extracted fixtures/helpers, no duplicated setup.
      emotional: >
        Confidence the cleanup did not quietly gut coverage; relief from test-rot dread.
      social: >
        A test suite teammates can read and trust; being seen as disciplined about
        test quality.
    four_forces:
      push: >
        Test rot accumulates; testing.md is not enforced anywhere; phil:refactor and
        phil:refactor-loop refuse or cannot safely touch tests.
      pull: >
        The same one-command, gated cleanup phil:refactor gives production code —
        but for tests; and (redesign-tests, 2026-07-06) safely fix tests that verify
        the wrong thing — implementation instead of behavior — one approved diff at a time.
      anxiety: >
        (A) A green suite does not prove an assertion was not weakened. (B) The tool
        might touch tests I did not want touched. (C) The tool might make behavior
        changes to my tests I did not sanction.
      habit: >
        Manual test cleanup, or leaving tests to rot; running phil:refactor on
        production code only.
    opportunity_score: not-scored   # single job; highest priority by default
    status: validated
    personas: [tess-test-maintainer]
    features: [refactor-tests, redesign-tests]
    # Forces refinement (DISCUSS, feature redesign-tests, 2026-07-06):
    # refactor-tests owns the assertion-preserving pole (anxiety C = "prevent unsanctioned
    # behavior change"). redesign-tests owns the opposite pole: sanctioned, per-diff-approved
    # behavioral rewrites. For redesign-tests, anxiety C is reframed as "a sanctioned rewrite
    # could still silently narrow coverage" (human-only oracle) — the accepted v1 risk (D7).
    # See docs/feature/redesign-tests/feature-delta.md § Changed Assumptions.

  - id: catch-ux-violations-while-building-ui
    # Registered by DISCUSS wave, feature: ux-standards-rule (2026-07-02)
    job_story: >
      When I'm building or editing a UI and I'm heads-down on behavior, I want the
      plugin to flag concrete UX/usability and accessibility violations and name the
      preferred form, so I can catch defects (missing states, placeholder-as-label,
      color-only status, unlabeled controls, sub-24px targets) before they ship —
      without having to hold all of Nielsen's heuristics and WCAG in my head.
    dimensions:
      functional: >
        Detect usability/accessibility violations in UI code during editing and review,
        cite the specific principle, and name the preferred form.
      emotional: >
        Confidence that obvious UX/a11y defects will not slip through; relief from
        carrying the whole heuristic/WCAG checklist mentally.
      social: >
        Ship UI that teammates and users perceive as usable and accessible; be seen as
        someone whose UI work clears the usability bar by default.
    four_forces:
      push: >
        No automated UX coverage exists; ui.md pushes aesthetics ("wow", premium) but
        nothing owns usability/accessibility; heuristics and WCAG are easy to forget mid-flow.
      pull: >
        The same auto-loaded "flag the violation, name the preferred form" help that
        react.md gives React idioms — but for UX usability and accessibility.
      anxiety: >
        (A) A rule that nags on every judgment call creates noise on dense expert tools.
        (B) It might duplicate or contradict ui.md's aesthetics guidance.
      habit: >
        Manual review, relying on memory, or catching UX defects only in QA/production.
    opportunity_score: not-scored
    status: validated
    personas: [devon-ui-developer]
    features: [ux-standards-rule, mobile-web-standards]
    # Mobile facet refinement (DISCUSS, feature mobile-web-standards, 2026-07-07):
    # The job is unchanged — Devon wants UI defects flagged in-flow — but its surface now
    # explicitly includes MOBILE WEB rendering. Refined dimensions/forces for the mobile facet:
    #   functional (mobile): also detect responsive/touch defects — layout that breaks reflow at
    #     320px CSS width or 400% zoom, orientation-locked views, gesture-only or hover-only
    #     interactions with no single-pointer/visible alternative, and sub-target touch controls.
    #   emotional (mobile): confidence the UI works on the small touch screens most users actually
    #     use, not just the desktop it was built on.
    #   push (mobile): the standards cover mobile only via the 24x24px target line (ux.md); reflow,
    #     zoom, orientation, pointer-gesture and motion-actuation defects have no owner, and ui.md's
    #     aesthetic advice (heavy animation, glassmorphism) implicitly pushes desktop-only polish.
    #   pull (mobile): the same auto-loaded "flag the violation, name the preferred form" help — now
    #     for mobile web — with always-flag items anchored to citable WCAG 2.2 SC.
    #   anxiety (mobile): a mobile tier that false-flags responsive judgment calls (breakpoint counts,
    #     intentional density) would erode trust exactly as the parent's anxiety (A) warned.
    # See docs/feature/mobile-web-standards/feature-delta.md.

  - id: deliver-invisible-work-with-discipline
    # Registered by DISCUSS wave, feature: phil-work (2026-07-13)
    job_story: >
      When I have a chunk of technical work that never surfaces to the end user —
      refactoring, re-architecting, cleanup, a migration, a dependency or performance
      pass — I want the same disciplined, multi-wave, test-backed workflow nwave gives
      user-facing features, so I can carry it through safely and leave a decision trail,
      instead of fighting nwave's user-story frame or doing it ad hoc with one-off
      tactical skills.
    dimensions:
      functional: >
        Take an invisible technical initiative from vague itch to a scoped goal plus a
        preservation contract, to a planned sequence of waves, to execution delegated to
        existing tactical skills, to a documented outcome — with behavior provably preserved.
      emotional: >
        Confidence the change broke nothing (the preservation floor); relief from the
        "is this refactor actually safe / am I done yet?" dread; a feeling of control over
        big, scary re-architectures.
      social: >
        A visible decision/progress trail teammates can follow; being seen as disciplined
        about tech-debt and architecture rather than cowboy-refactoring.
    four_forces:
      push: >
        nwave assumes personas/journeys/user-stories that invisible work does not have;
        the tactical skills (refactor, refactor-loop, review-code) are single-purpose — none
        discuss, plan across waves, or document decisions; so large technical initiatives
        get done ad hoc, or not at all.
      pull: >
        The same wave discipline (discuss → plan → execute → verify → document) nwave
        provides, but framed for a technical goal — a general contractor that sequences and
        gates the tactical skills already in the plugin.
      anxiety: >
        (A) another orchestrator that merely duplicates nwave/tactical skills without adding
        value; (B) ceremony overhead for work that sometimes only needs a quick tactical
        skill; (C) a preservation guarantee that is claimed but not actually enforced.
      habit: >
        Reaching for nwave and wrestling its user-story frame; firing tactical skills one-off
        with no plan and no trail; or doing big refactors by hand and hoping.
    opportunity_score: not-scored   # single new job; priority by default
    status: validated
    personas: [quinn-codebase-steward]
    features: [phil-work]

  - id: prove-qualitative-expectations-with-evidence
    # Registered by DISCUSS wave, feature: edd-loop (2026-07-15)
    job_story: >
      When I've handed building or changing something to AI agents and my intent
      includes qualitative expectations that formal tests can't cheaply assert
      (e.g. "error messages are helpful", "the API feels ergonomic", "the migration
      guide is clear to a newcomer"), I want a disciplined loop that captures those
      expectations, gets EXECUTED evidence they're met, and lets me adjudicate —
      without adding ceremony where my existing engines (nwave, phil:work) already
      prove the checkable ones — so I can trust AI-produced work against my real
      intent instead of reading every line or trusting the AI's narration.
    dimensions:
      functional: >
        Capture expectations in plain language; classify each as engine-checkable
        vs qualitative; OFF-RAMP the checkable ones to nwave (user-facing) or
        phil:work (invisible) unchanged; and for the qualitative residue commission
        or collect EXECUTED evidence produced by someone other than the builder,
        put it to human adjudication, and persist expectations + verdicts as living
        documentation.
      emotional: >
        Confidence the qualitative intent was actually met, not narrated; relief
        from the "the AI says it's fine, but did it really?" (fox-guarding-the-
        henhouse) dread; freedom to delegate to agents without reading everything.
      social: >
        Being seen as someone who ships AI-built work that genuinely meets intent;
        a reviewable expectation-and-evidence trail teammates can trust.
    four_forces:
      push: >
        AI agents produce large volumes of code fast; line-by-line review does not
        scale; the same AI that builds also "verifies" its own work (fox guarding
        the henhouse); qualitative intent gets dropped by formal tests or accepted
        on narration.
      pull: >
        A lightweight expectation -> executed-evidence -> human-adjudication loop
        that REUSES nwave / phil:work for everything checkable and adds a gate ONLY
        for the qualitative residue — the missing third option for the qualitative
        goals phil:work's FRAME currently refuses.
      anxiety: >
        (A) yet another orchestrator that merely duplicates nwave/phil:work — countered
        by the central off-ramp; (B) ceremony on work that did not need it — countered
        by bias-to-off-ramp + a gate that scales to zero when evidence already exists;
        (C) evidence that is narrated, not executed — countered by the executed-artifact
        rule; (D) the builder grading its own homework — countered by separation of
        powers (builder != evidence-producer; human is the final adjudicator).
      habit: >
        Trusting AI narration ("looks good to me"), reading every diff by hand, or
        silently dropping qualitative intent because no test exists for it.
    opportunity_score: not-scored   # single new job; priority by default
    status: validated
    personas: [avery-expectation-owner]
    features: [edd-loop]
    # Relationship to deliver-invisible-work-with-discipline (phil-work): distinct outcome.
    # phil-work's job is PRESERVE behavior through invisible change (preservation floor +
    # checkable goal). This job is PROVE a qualitative expectation is met with executed
    # evidence, and it spans BOTH visible (nwave) and invisible (phil:work) work. phil:edd
    # delegates the build to those engines and inherits their oracle (ADR-005 lineage); it
    # adds only the qualitative-evidence gate they structurally lack.

  - id: get-independent-adversarial-critique-of-completed-work
    # Registered by DISCUSS wave, feature: adversarial-review (2026-07-15)
    job_story: >
      When I (or an AI agent I delegated to) have just completed a task and I'm about to
      trust it, ship it, or call it done, I want an INDEPENDENT adversary to actively try to
      falsify "done" — separating what's hard-checkable from what's a judgment call, attacking
      the output against my intent and standards, and handing me ranked, evidence-bearing
      findings — so I can catch the flaws the builder rationalized past, without either trusting
      the builder's own self-assessment or reading every line myself.
    dimensions:
      functional: >
        An independent reviewer (fresh context, never saw the builder's reasoning trace) takes
        a completed task's output + stated intent, SPLITS hard-checkable claims (verified in
        code / by an available oracle) from soft judgments (adversarially critiqued), attempts a
        falsifying case, and returns a ranked span-and-evidence verdict — advisory, never
        self-adjudicating. Usable standalone, composable into phil:work / phil:edd /
        phil:refactor-tests, and weavable ad-hoc into workflows.
      emotional: >
        Confidence a hostile independent pass hunted for what's wrong before I trusted it;
        relief from "the AI says it's fine, but did anyone actually try to break it?"; freedom
        to delegate without either rubber-stamping or reading everything.
      social: >
        Shipping work that survived an adversarial pass; a "done" that is defensible rather than
        self-certified; being seen as disciplined about independent verification.
    four_forces:
      push: >
        Builders (human or AI) grade their own homework; every existing critic is bound to a
        specific oracle (refactor-loop's suite) or gate (edd's evidence) — there is no general
        adversary you can point at any completed task; soft self-review has correlated-error
        blind spots (the tri-agent trap).
      pull: >
        The refactor-critic generalized out from behind its test oracle — an independent
        adversarial reviewer any command / workflow can call, honest about hard-vs-soft,
        returning ranked findings not a rubber stamp.
      anxiety: >
        (A) an all-soft-critic loop that is just theatre — LLM judging LLM, dressed as a sound
        gate (THE force the design is built against; the central tri-agent warning); (B) nit-noise
        — a reviewer that floods low-value findings; (C) ceremony on work that did not need review;
        (D) same-model / same-context correlated blind spots make the "independent" review not
        actually independent.
      habit: >
        Trusting the builder's self-assessment ("looks good to me"); reading every diff by hand;
        catching flaws only in review / QA / production.
    opportunity_score: not-scored   # single new job; priority by default
    status: validated
    personas: [rowan-skeptical-delegator]
    features: [adversarial-review]
    # Relationship to prove-qualitative-expectations-with-evidence (edd-loop): SIBLING, distinct
    # outcome. edd PRODUCES executed evidence and hands it to a human to adjudicate (producer !=
    # builder; human is the oracle). This job DOES THE JUDGING: an independent critic attacks the
    # output and returns findings/a verdict. edd's deferred agents/edd-evidence-critic is the
    # narrow ancestor; this is the general-purpose form.
    # Load-bearing constraints (DISCUSS, 2026-07-15) — informed by the tri-agent clarification
    # framework (Zhao, KDD '25), read via the harebrain summary
    # docs/research-summaries/tri-agent-clarification (in the sibling `harebrain` repo) + LLM-Modulo/ABC lineage:
    #   C1 INDEPENDENCE: reviewer runs in fresh context and never sees the builder's reasoning
    #      trace (correlated-error avoidance). Different-model hardening deferred to DESIGN.
    #   C2 HARD/SOFT SPLIT: every review partitions findings into hard-checkable (actually run
    #      the check / inherit the host's oracle, ADR-005 lineage) vs soft (adversarial, labeled).
    #   C3 ADVISORY, NEVER SELF-ADJUDICATING: findings are input the host command or human gates
    #      on; the reviewer never declares done.
    #   C4 HONESTY LABEL: when no oracle exists, the review is labeled a soft DRAFT SIGNAL, never
    #      dressed as a sound gate. This is to adversarial-review what the off-ramp is to edd.
    #   C5 SPAN-AND-EVIDENCE / ANTI-FLATTERY: no finding without a span + evidence; empty praise
    #      is coerced to CANNOT_ASSESS (carried from refactor-critic-correctness).

  - id: carry-work-across-session-boundaries
    # Registered by DISCUSS wave, feature: session-handoff (2026-08-12)
    job_story: >
      When a session ends mid-initiative — context exhausted, the day over, or compaction
      hit — I want the next session to pick up with the reasoning, the intended next action,
      and the correct entry-point already in hand, so I can keep momentum instead of
      re-explaining the state of play or watching a fresh agent freelance work that a
      command should have driven.
    dimensions:
      functional: >
        Capture the state a fresh session cannot derive (the why, the how, the intended next
        action, the claimed card), surface it at session start, and route the session to the
        correct entry-point — without becoming a second authority over facts the artifacts
        already own.
      emotional: >
        Relief from re-explaining the state of play at the top of every session; confidence
        the next session resumes correctly rather than plausibly-but-wrongly; trust that a
        snapshot is either current or honestly says it is not.
      social: >
        A teammate, or a future self, can see what was in flight and why it stopped; being
        someone whose work gets picked up cleanly rather than restarted.
    four_forces:
      push: >
        continue.md (108 lines) and todo.md (19 lines) are hand-maintained resume notes, both
        scoped to a single feature rather than a session, and both stale — newest date
        2026-07-01 with ~a dozen commits since. /nw-continue reconstructs only wave-managed
        nWave features. A fresh session performs work inline that a command should have driven.
        The why is never recorded anywhere at all.
      pull: >
        One command to put the session down and one to pick it up, so resumption is not a
        re-briefing; and a card or snapshot that names the entry-point so the agent routes
        instead of freelancing.
      anxiety: >
        (A) A snapshot the human must remember to update goes stale silently, and a stale
        handoff is WORSE than none because the next session trusts it — THE force the design
        is built against, and an observed failure of continue.md rather than a hypothetical.
        (B) Two authorities over the same state (a local file and the board) drift — forbidden
        by phil:issue-board under "One system of record per scope". (C) Session scratch
        published to a board is visible to everyone who reads the board. (D) Ceremony on work
        that did not need it (the anxiety phil:work B and edd B both carry, countered there by
        an off-ramp).
      habit: >
        Hand-writing continue.md; re-explaining state in the first prompt of each session;
        letting the agent start freelancing and correcting it mid-flight.
    opportunity_score: not-scored   # single new job; priority by default
    status: validated
    personas: [kai-session-relay]
    features: [session-handoff, live-work-stack]
    # The design axis (DISCUSS, 2026-08-12): five categories of lost state, ranked by whether a
    # fresh session can recover them unaided. Anything recoverable that a snapshot ALSO records
    # becomes a second authority that can drift (anxiety B).
    #   1 the why   — decisions, ruled-out approaches, why work stopped   UNRECOVERABLE
    #   2 the how   — which command/skill/entry-point should drive it     UNRECOVERABLE
    #   3 what-next — the intended next action                           partly; wrong guess is costly
    #   4 the card  — which card was claimed and why it was next          board knows status, not claimant
    #   5 the where — file, step, branch, commit                         LARGELY SOLVED (/nw-continue,
    #                 /phil:nwave-slice-status) — nWave features only; must NOT be re-recorded
    # Categories 1 and 2 are the irreducible core: no reconstruction can recover what was never
    # an artifact. Category 2 subsumes the concern originally filed standalone as issue #10.
    # Relationship to deliver-invisible-work-with-discipline (phil-work): distinct outcome.
    # phil-work owns discipline WITHIN one initiative and says nothing about the session boundary;
    # this job owns continuity ACROSS that boundary, for nWave and non-nWave work alike.
    #
    # Cross-person facet (DISCUSS, feature single-issue-per-feature, 2026-08-14):
    # The job is unchanged — Kai wants the next session to resume without a re-briefing — but the
    # premise behind its SURFACE changed, and one validated force becomes a deliberate trade.
    #   anxiety (C), as originally recorded: "Session scratch published to a board is visible to
    #     everyone who reads the board." STILL TRUE, and no longer avoided. Teammates were confirmed
    #     real on 2026-08-14, and ADR-013's own consequence line — "Nothing is shared with a teammate.
    #     Accepted for v1; the partitioned option above is the documented path if that need appears" —
    #     names this the trigger. The trade: .session-handoff.md keeps in-flight scratch and remains the
    #     single authority; a generated, delimited, timestamped PROJECTION carries into the issue only
    #     what a teammate needs. Nothing is read back, so anxiety (B) — two authorities drift — is
    #     answered structurally rather than by discipline.
    #   functional (cross-person): the five categories of lost state are unchanged, but category 1
    #     (the why) and category 2 (the how) must now reach a DIFFERENT PERSON, not only a later
    #     session. Category 5 (the where) is still derived and still must not be re-recorded.
    #   habit (cross-person): asking the feature's owner in chat what state it is in.
    # See docs/feature/single-issue-per-feature/feature-delta.md § Upstream changes.
    #
    # Live-view facet (DISCUSS, feature live-work-stack, 2026-08-18, issue #29):
    # The job is unchanged — Kai wants to resume without a re-briefing — but every force above is
    # about the session BOUNDARY, and one of the five categories has a failure that lives entirely
    # INSIDE a session. The work stack (category 1's shape, registered 2026-08-14) is recorded only
    # when the session is put DOWN, which is precisely when Kai has stopped needing it.
    #   functional (live-view): the stack gains OPERATIONS, not just a format — push at the moment of
    #     diversion, show on demand at any depth, pop on return. A frame's AGE becomes readable,
    #     because a frame pushed and never popped is the failure mode.
    #   push (live-view): three frames deep in a detour there is no command to run, and
    #     .session-handoff.md is empty because no handoff has happened yet. Confirmed by dogfood on
    #     2026-08-14: the first live /phil:handoff recorded an EMPTY stack because the session ended
    #     at a slice boundary rather than inside a detour, and slice 04 recorded at the time that
    #     "the feature's headline mechanism is still unexercised".
    #   pull (live-view): capture the reason for leaving while it is still in Kai's head, rather than
    #     reconstructing it at wind-down; and answer "where am I and why" without scrolling the
    #     transcript.
    #   anxiety (live-view): (A) restated one level down — a frame pushed and never popped is WORSE
    #     than no stack, because the reader trusts it. This is the parent job's anxiety A applied to
    #     a frame instead of to a snapshot, and it is why staleness marking is in scope rather than
    #     deferred. (B) two writers on .session-handoff.md — answered structurally by [D1]: push and
    #     pop regenerate the WHOLE file, so there is one writer, not two. (C) ceremony, the parent's
    #     anxiety D one level down — a frame for every two-minute detour costs more than the detour;
    #     answered by push being optional and never prompted for.
    #   habit (live-view): holding the return path in working memory; scrolling the transcript to
    #     recover why a file is open; re-deriving intent from git diff.
    # The overwrite rule is AMENDED rather than carved out: it was written against merging ANOTHER
    # session's snapshot, and its stated rationale is entirely about a competing worktree. A session
    # rebuilding its own snapshot was never what it forbade. See feature-delta.md [D1] and [D2].
    # See docs/feature/live-work-stack/feature-delta.md.

  - id: keep-a-backlog-trustworthy
    # Registered by DISCUSS wave, feature: groom-issues (2026-08-12)
    job_story: >
      When my issue board has accumulated cards that someone — often a past me — dropped in
      half-finished, I want the board systematically brought into shape, with the judgement
      calls put to me rather than guessed, so I can trust what the board says and rank it
      without ranking misunderstood work.
    dimensions:
      functional: >
        Bring every issue to a stated standard — a body that says what and why, links that
        resolve, correct single-valued labels — and resolve the defects that live BETWEEN
        issues (duplicates, oversized cards, work overcome by events, ungrouped effort, a feature
        decomposed into slice cards under retired rules),
        surfacing evidence for each rather than applying judgement calls unasked.
      emotional: >
        Trust that the board says what it means; relief from the dread of a backlog nobody has
        read end to end; confidence that ranking it will rank real work.
      social: >
        A board a teammate can read and act on without asking what a card means; being someone
        whose backlog is navigable rather than a graveyard.
    four_forces:
      push: >
        Issues get filed half-finished and nothing catches it. phil:issue-board covers how to
        MANIPULATE an issue — labels, links, chains, position — but never says what a body must
        CONTAIN, so "appropriate description" is not checkable and grooming is vibes. Defects
        between issues (duplicates, oversized cards) are structurally invisible to a per-issue
        read. And ranking (phil:rank-issues) runs on whatever the board says, so a misunderstood
        card gets confidently ranked.
      pull: >
        One command that reads the whole board cheaply, reports what is wrong with evidence,
        fixes what is mechanical, and asks about everything else.
      anxiety: >
        (A) An irreversible set-level operation applied without asking — a closed duplicate, a
        split that cut the wrong seam, a milestone nobody wanted. (B) A `groomed` marker that
        lies the moment a human edits the issue — the second authority phil:issue-board forbids
        under "One system of record per scope". (C) A defect oracle that is really taste, because
        nothing states what a body must contain. (D) Ceremony on a board that was already fine.
      habit: >
        Reading the board only when something feels wrong; fixing issues ad hoc while tripping
        over them; or leaving it and ranking anyway.
    opportunity_score: not-scored   # single new job; priority by default
    status: validated
    personas: [robin-backlog-curator]
    features: [groom-issues]
    # Setup facet (DISCUSS, feature board-setup-block, 2026-08-14, issue #32):
    # The job is unchanged — Robin wants a board that says what it means — but one of its checks has an
    # input with no author, and that is a DIFFERENT job (know-a-boards-hazards-before-contact) rather
    # than a facet of this one. Recorded here only as the dependency:
    #   push (setup): rule 4 is checkable ONLY where the project declares its label families, and absent
    #     a declaration it reports `unevaluated` — which reads as clean to anyone not looking for it. So
    #     the check most likely to go dark is the one whose input nothing helps anyone write.
    #   The remedy is NOT to loosen rule 4 or to let grooming infer a family from the labels in use; that
    #     would make the board's habits audit themselves, which this job's anxiety (C) already forbids.
    # phil:groom-issues is UNCHANGED by that feature. What changes is that its input gains an author.
    # See docs/feature/board-setup-block/feature-delta.md [D3].
    # Relationship to the ranking work (phil:rank-issues, #8): sequential, not overlapping.
    # Grooming settles what each card MEANS; ranking settles what order they go in. Ranking's
    # own precondition names grooming as advice rather than a gate — a messy board can be
    # ranked, just worse.
    #
    # Elicitation facet (DISCUSS, feature groom-issues slice 04, 2026-08-13, issue #25):
    # The job is unchanged — Robin wants a board that says what it means — but the forces gain a
    # dimension the original wave did not name. Refined dimensions for the elicitation facet:
    #   functional (elicitation): the semantic half of the standard must have an EXIT. Rules 1 and 2
    #     (a purpose, a way to tell when it is done) are the two a title-only card fails, and they
    #     are precisely the two no automated pass may resolve — so on the original design they are
    #     reported forever and resolved never.
    #   push (elicitation): a real finding with no route to resolution is indistinguishable from one
    #     a human read and chose to leave, because D6 stores no marker. The board that most needs
    #     grooming produces the most durable report and the least change.
    #   anxiety (elicitation): (E) A tool that writes a purpose it inferred. The refusal in
    #     phil:groom-fix is correct and must survive — the gap is not permission to invent, it is a
    #     scribe. Elicitation asks the human and writes THEIR answer.
    #     NARROWED 2026-08-14 (scribe → editor, owner reversal). The anxiety stands; its SUBJECT changes
    #     from "what the session may write" to "what the session may write UNSEEN". Elicitation now
    #     presents the card, offers a suggestion or two, and may write a clean rewrite rather than a
    #     transcript — because the hazard was never that the session drafted, it was that a drafted
    #     sentence is indistinguishable from a dictated one once written. Per-field provenance
    #     (you wrote / you accepted my suggestion / you edited my suggestion / I rephrased your answer)
    #     plus answer-beside-written-form is what restores the distinction, and it covers a path verbatim
    #     never did: a session that offered a draft and got a nod satisfied the old rule while producing
    #     a body nobody composed. An UNLABELLED field is now the defect; a drafted one is not.
    #     phil:groom-fix's refusal is untouched — it never asks, so it may never draft.
    #     See docs/feature/groom-issues/feature-delta.md § Slice 04 amendment — scribe to editor.
    #   habit (elicitation): opening the forge in a browser to fix a body by hand, losing the
    #     session's context; or leaving the card and letting the finding recur.
    # Observed 2026-08-13: all three commands hold AskUserQuestion and all three use it only for
    # CONSENT — pick a scope, pick a merge survivor. None ever asks what an issue is FOR.
    #
    # Paradigm facet (DISCUSS, feature single-issue-per-feature, 2026-08-14):
    # The job is unchanged — Robin wants a board that says what it means — but the DEFECT ORACLE is
    # paradigm-dependent in two places, and on the one-issue-per-feature paradigm both fire against
    # correctly-shaped cards.
    #   functional (paradigm): "oversized card" cannot be judged on size once a whole feature is one
    #     issue by design. The discriminator becomes STRUCTURE: a feature card is large and carries a
    #     generated projection; an oversized card is large and unstructured.
    #   push (paradigm): a heuristic that flags every correct card teaches people to stop running the
    #     tool — the same failure as manufacturing work on a clean board, arrived at from the other side.
    #   anxiety (paradigm): (F) An oracle loosened to stop the false positives stops catching the real
    #     ones. The fixture pair must resolve opposite ways, in the style of 04/11.
    # Session state in a body is currently a defect — journeys/groom-issues.yaml error path at `scan`,
    # citing ADR-013 on world-readability. REVERSED AND SCOPED, not deleted: inside the generated
    # markers it is intended; typed scratch outside them is still a defect.
    # See docs/feature/single-issue-per-feature/slices/slice-05-grooming-and-ranking-adapt.md.

  - id: make-in-flight-work-transferable
    # Registered by DISCUSS wave, feature: single-issue-per-feature (2026-08-14)
    job_story: >
      When a feature I own is in flight on a board other developers also work from, I want the issue
      itself to carry the whole feature — where it stands, what is next, and why work stopped where it
      did — so I can put it down at night and pick it up in the morning, and a teammate can take it
      over without asking me anything.
    dimensions:
      functional: >
        One issue per feature carrying a generated roadmap projection, the current position with
        per-step state, the diversion stack, and blockers as real forge links; the board column
        expresses the wave, so process position and work state are both legible without opening the repo.
      emotional: >
        Confidence that putting work down does not lose it; relief from being the single point of
        knowledge on a feature; freedom to be diverted without paying to reconstruct where attention was.
      social: >
        A teammate takes over cleanly; being someone whose in-flight work is legible rather than
        personal; a board the team reads rather than one developer's private queue.
    four_forces:
      push: >
        Slice cards are never independently assignable, so N cards of one feature crowd a shared board
        while telling a teammate nothing actionable. The reasoning lives in .session-handoff.md, which is
        git-ignored and machine-local — ADR-013 states the consequence outright: "Nothing is shared with
        a teammate." The diversion stack (task A to B to a devops script C and back) is recorded in no
        artifact, by design. roadmap.json holds the plan and is invisible to anyone outside the repo.
      pull: >
        One issue that IS the feature: a generated roadmap projection showing what is next, a stack
        showing where attention actually is, blockers as forge links, and a column that says which wave
        it is in — self-contained enough that resumption is reading one page. ADR-013 already named this
        the likely end state and deferred it.
      anxiety: >
        (A) Session scratch on a world-readable board — the validated anxiety C of
        carry-work-across-session-boundaries, now a deliberate trade rather than a force avoided.
        (B) Two authorities over one fact, with the forge copy carrying the widest audience — answered
        structurally by keeping the local file authoritative and never reading the projection back.
        (C) A stack that goes stale because a pop was never recorded, which beats no stack the way a
        stale handoff beats none (Kai's central force, inherited). (D) One card per feature stops showing
        what is MOVING — the slice-card design's own rationale, inverted. (E) A block large enough for a
        22-phase roadmap trades hundreds of cards for one unreadable page.
      habit: >
        Slice cards nobody else picks up; the reasoning on one laptop; asking the feature owner in chat
        what state it is in; re-deriving position from git log and /phil:nwave-slice-status.
    opportunity_score: >
      highest of three adjacent jobs — importance high (teammates confirmed real 2026-08-14),
      satisfaction very low (no mechanism exists; ADR-013 explicitly declined it). Scored against
      keep-a-backlog-trustworthy (medium: groom-issues ships) and
      carry-work-across-session-boundaries (medium: solo case solved, cross-person half at zero).
    status: validated
    personas: [morgan-feature-owner]
    features: [single-issue-per-feature]
    # The premise correction this job rests on (DISCUSS, 2026-08-14). nwave-issue-board makes the SLICE
    # the card, justified as "nWave is worked one feature at a time" — but that is a property of a
    # DEVELOPER, not of a repo. With several developers each owning a feature, every conclusion drawn
    # from the single-card premise needs re-deriving, including the wave-as-label-not-column reversal of
    # 2026-08-10, whose only stated reason was that premise.
    # Relationship to carry-work-across-session-boundaries (session-handoff): SIBLING, distinct outcome.
    # That job carries work across a SESSION boundary for one person; this one carries a feature across a
    # PERSON boundary, and the session case falls out as the degenerate form where both people are you.
    # Relationship to keep-a-backlog-trustworthy (groom-issues): sequential, as grooming and ranking
    # already are. This job decides what a card IS; that one decides whether it says what it means.
    # Load-bearing constraints (DISCUSS, 2026-08-14):
    #   C1 SINGLE-AUTHORITY-PER-FACT, not "the forge stores nothing" — the reframe that lets a projection
    #      exist without inverting the one-way rule.
    #   C2 Generated, delimited, timestamped, never read back.
    #   C3 No hand-ticked state: glyphs, never checkboxes (fixture 15).
    #   C4 Bounded description — roster plus the CURRENT slice's steps only.
    #   C5 Derivation stays with its owner (phil:nwave-slice-status).
    #   C6 Absent state renders as `unknown`, never as a benign default.
    #   C7 No per-push forge writes; refresh at boundaries only.

  - id: know-a-boards-hazards-before-contact
    # Registered by DISCUSS wave, feature: board-setup-block (2026-08-14, issue #32)
    job_story: >
      When I point the plugin's board tooling at a repo whose forge instance nobody has operated before,
      I want everything discoverable to be discovered and everything undiscoverable to be asked — each
      written down and labelled with which it was — so the instance's hazards are learned from a file
      rather than from a call that reported success while doing the wrong thing.
    dimensions:
      functional: >
        Probe the forge for everything it can answer (tier, project, Status field and option ids, enabled
        built-in workflows, docs root, whether the repo is nWave), elicit only what no forge records
        (label families), label every written line as probed, declared or assumed, and write the probed
        half into the repo's CLAUDE.md inside markers that cannot reach the prose around them.
      emotional: >
        Confidence the next board call will do what it says rather than something adjacent and silent;
        relief from the "did that just close something?" dread; trust that the file says where each line
        came from, so a stale one is visible as stale.
      social: >
        A repo a teammate can operate on day one instead of inheriting as tribal knowledge; being someone
        whose setup is inspectable rather than remembered.
    four_forces:
      push: >
        phil:issue-board ends with a Per-project setup TEMPLATE and nothing writes it. Every entry in this
        repo's block was added by hand as each constant was discovered, and SIX OF SEVEN were recorded
        only after the thing they document had already gone wrong. The constants are precisely the ones
        where a wrong guess REPORTS SUCCESS: an inferred remote mutating another repo's #12, a Status
        write that also closes the issue and silently drops the comment queued behind it, a
        updateProjectV2Field call whose singleSelectOptions is a full replacement and would have
        destatused 25 cards. And phil:groom-issues rule 4 reads a declaration nothing helps anyone write,
        so the check most likely to go dark is the one whose input has no author.
      pull: >
        One command that discovers what is discoverable, asks only what no forge records, labels which is
        which, refuses to overwrite what a human decided, and can be re-run without churning the file.
      anxiety: >
        (A) A generator that INFERS a label family invents the declaration rule 4 was supposed to read —
        the board's habits auditing themselves, which groom-issues forbids in as many words. THE force
        the design is built against. (B) A regenerated block that overwrites hard-won prose: this repo's
        block is mostly hazards recorded after contact and no probe can reproduce a line of it —
        countered structurally by the delimited region rather than by care. (C) A block that goes stale,
        where an option id that no longer exists reads exactly like one that does (the shape of issue
        #31). (D) A probe that reports a fact it only PARTLY has — "Auto-close issue: enabled" is probed,
        "Done is what fires it" is not, and one confident sentence spanning both is (A) one register
        quieter. (E) Ceremony on a repo that was already configured — countered by a re-run that writes
        zero bytes and says `unchanged`.
      habit: >
        Filling the template in by hand as each constant is discovered; copying another repo's block and
        editing the ids; or skipping it and finding out.
    opportunity_score: >
      importance high — every adopting repo pays, and the failures are all silent-success class.
      satisfaction ZERO — nothing writes the block at all; the template is the whole of the current
      solution. Scored against keep-a-backlog-trustworthy (medium: groom-issues ships, but its rule 4 is
      dark without this) and make-in-flight-work-transferable (medium-high: shipping). Highest of the
      three FOR A REPO NOT YET CONFIGURED — which is the honest scoping, because this repo is already
      configured and its seven entries ARE the record of the failure.
    status: validated
    personas: [robin-backlog-curator]
    features: [board-setup-block]
    # Relationship to keep-a-backlog-trustworthy (groom-issues): SIBLING, distinct outcome, and the
    # boundary is worth holding. That job is about what a CARD means; this one is about whether the
    # INSTANCE will do what the call says. They meet at exactly one point — rule 4's declaration — and
    # the meeting is a dependency, not an overlap: this feature gives that check an author and changes
    # nothing about the check.
    # Why no new persona: the adopter and the curator are the same human at t=0 and t=1. Robin's file
    # already carries the load-bearing line — "anything irreversible is mine to decide, not the tool's" —
    # and this feature's central refusal is that line applied to a declaration rather than a card.
    # Load-bearing constraints (DISCUSS, 2026-08-14):
    #   C1 PROBE-DON'T-ASK. Asking for a value the forge can answer is the current failure, not a fix.
    #   C2 The probed region is delimited, generated, timestamped, and placed AMONG prose it may never
    #      touch — the inverse of nwave-issue-board's block, where nothing human belongs.
    #   C3 THREE categories, each labelled: probed / declared / assumed. An UNLABELLED line is the
    #      defect — the same shape groom-ask reached on 2026-08-14, where an unlabelled field rather
    #      than a drafted one became the thing to forbid.
    #   C4 Never infer a declaration. Evidence beside the question; never in the answer.
    #   C5 Outside the markers the command may report and ask, and may not write.
    #   C6 Absent renders as `unknown` or `not applicable`, never as a benign default.
    #   C7 Silence is not consent — no offer adopted without an explicit answer.


  - id: answer-a-tools-question-without-decoding-it
    job_story: >
      When a command stops mid-task and hands me a decision only I can make, I want the question
      posed in language I can act on without first reconstructing the asker's context, so I can
      decide in one pass instead of spending a turn asking what is actually being asked.
    dimensions:
      functional: >
        State what is being decided and what turns on it, in plain English, with no internal
        vocabulary, inside a bounded length, and place it where it can be found — before any
        options are listed.
      emotional: >
        Confidence that the answer given is an informed one rather than a guess at a half-understood
        question; relief from the standing tax of asking what was asked.
      social: >
        Decisions on the record that the decider actually understood — and a tool that can be handed
        to someone without the asker's context and still be answerable.
    four_forces:
      push: >
        Three measured failure modes: a bare numbered list with no framing; a jargon-packed wall in
        the asker's internal vocabulary; and an adequately-worded request buried in surrounding
        output. Thirteen commands grant `AskUserQuestion` and not one says a word about how to use it.
      pull: >
        The standing manual workaround, which already works — "explain in 200 words of plain English
        using no jargon or labels what is needed from me" — applied by default rather than typed.
      anxiety: >
        (A) A bounded length squeezes a genuinely complicated decision. (B) A standard with no
        mechanism is the same category as the prose that already failed. (C) A rule that fires on
        file type is dark at the exact moment a question is asked.
      habit: >
        Typing the plain-English demand as a follow-up turn, every time; or answering the
        half-understood question and finding out later.
    opportunity_score: high-importance-low-satisfaction
    status: validated
    personas: [ari-interrupted-decider]
    features: [decision-request-standard]
    # Relationship to every other job in this file: ORTHOGONAL, and that is the finding. Robin, Tess,
    # Quinn, Avery, Rowan, Kai and Morgan are each asked to decide something by the features they own,
    # and each becomes Ari at that moment. The job is not a facet of any of them because it is not about
    # a domain — it is about the POSITION of holding a question without the asker's context. Attaching
    # it to one persona would imply the other seven do not hit it; all eight do.
    # Why a NEW persona rather than a facet (contrast board-setup-block, which took the facet route):
    # there the actor was the same human one step earlier in the same job. Here the actor is any of
    # eight humans at a moment orthogonal to their job. A facet on one file would be wrong on the
    # other seven.
    # Load-bearing constraints (DISCUSS, 2026-08-21):
    #   C1 The question states what is being decided and what turns on it BEFORE any options.
    #   C2 Plain English. No internal vocabulary — no wave labels, issue numbers, slice ids, skill
    #      names, artifact paths — in the ask itself.
    #   C3 200 words is a HARD CEILING on the ask, countable and failable. Not a target.
    #   C4 Supporting detail is permitted, unbounded, and SEPARATED from the ask. The ceiling applies
    #      to the question, never to what a reader may opt into afterwards.
    #   C5 Placement is part of the asking. Failure mode 3 is a placement defect, not a wording one,
    #      so a conforming ask that is buried still fails.
    #   C6 The mechanism is named, and where it cannot be enforced that is STATED rather than implied.
    #      A convention with no enforcement is what already failed here.
