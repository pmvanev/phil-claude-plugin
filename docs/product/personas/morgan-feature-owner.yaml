# Persona (SSOT) — bootstrapped by DISCUSS wave, feature: single-issue-per-feature (2026-08-14)
# EXTENDED 2026-09-04 by DISCUSS wave, feature: story-spans-features (issue #36).
# WHAT WAS EXTENDED: the four entries marked `# story tier` below, plus the second paragraph of `role`.
# WHY IT IS AN EXTENSION AND NOT A NEW PERSONA: the owner of a STORY is the same developer who builds its
# features — not a planning role above them. The role is identical and only the unit of ownership moved,
# so a new file would have asserted a second reader of the same card, and a second reader is what would
# justify a second authority. Note this is the OPPOSITE outcome to the 2026-08-14 pass, which created this
# file rather than extending Kai or Robin — there the ROLE differed, here only the SCOPE does. Rules do
# not have preferred outcomes.

id: morgan-feature-owner
name: Morgan
role: >
  Owns a whole feature end-to-end on a board that other feature owners also work from, and is both the
  person who hands one over and the person who inherits one. Distinct from the two adjacent personas,
  and the distinction is why this file exists: Kai (session-handoff) hands the baton to their OWN next
  session; Robin (groom-issues) curates cards without working them. Neither is the developer who picks
  up a colleague's half-done feature.

  Also owns a STORY — several features that together deliver one outcome, executed one at a time.
  Same developer, wider unit; there is no planning role above this one.
goals:
  - Open a feature's issue and know within seconds where the work stands
  - Put a feature down at night and pick it up in the morning without re-briefing
  - Hand a feature to a teammate who can resume it without asking a question
  - Be diverted mid-work without paying to reconstruct where attention was
  - >
    # story tier
    See both positions at once — where I am inside the current feature, and where that feature sits
    inside the whole story — without opening a second thing
frustrations:
  - Slice cards are never independently assignable, so a shared board shows N cards nobody else can pick up
  - >
    The reasoning lives in .session-handoff.md, which is git-ignored and machine-local — ADR-013 states
    the consequence outright: "Nothing is shared with a teammate"
  - The diversion stack — task A to B to a devops script C and back — is recorded in no artifact, by design
  - Knowing a feature's state means cloning the repo and running a command, or asking the owner in chat
  - >
    # story tier
    A story-sized outcome is better built as several small features, and the board has no way to say so
    at all — the grouping exists only in my head, or in a milestone that also holds unrelated work
mental_model:
  - "A feature is the unit somebody owns; a slice is not something you hand to another person"
  - "If understanding the state takes more than seconds, nobody will check it and the board goes unread"
  - "A projection that says when it was made is honestly stale; one that does not is indistinguishable
    from current"
  - "Absent state must say unknown — an empty stack reads as no diversions, which is a different claim"
  # story tier
  - "The card is whatever I own; sometimes that is one feature and sometimes it is several"
  - "A goal is why the work matters and when it is due; a story is what the work is made of"
  - "Show me one level down and link the rest — I will open the brief when I need it"
vocabulary:
  - feature card, wave column, projection, generated block, diversion stack, frame, push and pop,
    current slice, glanceability, transferable, inherit, one system of record
  # story tier
  - story card, story roster, feature roster, current feature, membership, position, story vs goal,
    one expanded path, unit of ownership

# Prose facet — added by DISCUSS wave, feature: board-prose-standard (2026-09-04, issue #40).
# EXTENDED, not replaced. The unit of ownership is untouched; what this facet adds is that the block's
# ROW BOUND and the block's WORDS are different properties. Morgan's thirty-second budget is spent on
# words, and the bound protects only the count. The live instance is Morgan's own: seven two-line roster
# descriptions written onto issue #36 with no standard consulted, under a stated requirement of "not
# overly verbose or mentally taxing".
prose_facet:
  goals:
    - Pick a feature off the roster from its two lines alone, without opening its brief
    - Have the thirty seconds the bound protects spent on words that carry information
    - Read a teammate's projected reasoning without reconstructing the sentence first
  frustrations:
    - A bounded block can have every cell inside it padded and still pass every check
    - The one place brevity was the explicit acceptance criterion is the place no standard was applied
    - A two-line description that spends a line on framing has half the room it looks like it has
  mental_model:
    - Rows are bounded by a count; sentences are bounded by a standard, and I need both
    - The writer that regenerates the block whole can apply a standard without becoming two writers
    - There is nothing to edit in a glyph, so a pass over derived cells could only be a second author
    - A projection I cannot read in one pass is not transferable, whatever its row count says
  vocabulary:
    - composed sentence vs derived cell, one-writer rule, row bound vs word budget,
      two-line description, summarising clause, thirty-second read
