# Persona (SSOT) — bootstrapped by DISCUSS wave, feature: groom-issues (2026-08-12)

id: robin-backlog-curator
name: Robin
role: >
  Owns an issue board that other people — and a past self — also file into, and pays when a card
  turns out to mean something other than what it said. Curator rather than steward: Quinn holds
  stewardship of the codebase; Robin holds the board that decides what gets worked on it.
goals:
  - Trust that every card on the board says what it means, without reading all of them again
  - Catch the defects that live between issues — duplicates, oversized cards, work overcome by events
  - Keep judgement calls with a human, and let the mechanical fixes happen without ceremony
  - Hand a groomed board to ranking, so the order is over understood work
frustrations:
  - Cards get filed half-finished and nothing catches it
  - Nothing states what a body must contain, so "appropriate description" is not checkable
  - Duplicates and oversized cards are invisible when reading one issue at a time
  - A backlog nobody has read end to end is one nobody trusts, so it gets bypassed rather than fixed
mental_model:
  - A board is only worth ranking if the cards mean what they say
  - The expensive mistakes live between issues, not inside one
  - Anything irreversible — closing, splitting, merging — is mine to decide, not the tool's
  - A "groomed" marker would start lying the first time someone edited an issue
vocabulary:
  - grooming, defect table, well-formed body, duplicate, oversized, overcome by events,
    set-level pass, mechanical vs semantic, house default, one system of record

# Setup facet — added by DISCUSS wave, feature: board-setup-block (2026-08-14, issue #32).
# Robin one step earlier: before a card can mean what it says, the board's own constants have to be
# known. A ninth persona ("the adopter") was considered and rejected — the adopter and the curator are
# the same human at t=0 and t=1, and two files about one person's goals must then be kept in agreement.
setup_facet:
  goals:
    - Learn the instance's hazards from a file rather than from a call that reported success
    - Never be asked for a value the forge could have answered
    - See, for every line, whether it was probed, declared, or assumed
  frustrations:
    - The per-project template has no author, so every constant arrives by hand as it is discovered
    - Six of this board's seven recorded hazards were written down only after they had already bitten
    - The dangerous constants are exactly the ones where a wrong guess reports success
    - A check whose input nobody helps you write reports `unevaluated`, which reads as clean
  mental_model:
    - A wrong forge target does not error — it succeeds against someone else's board
    - Prose I wrote after being bitten cannot be regenerated, so nothing generated may sit on top of it
    - An assumption written as a fact is the same defect as an inferred declaration, one register quieter
    - Anything irreversible is mine to decide, not the tool's — applied to a declaration, not just a card
  vocabulary:
    - probed, declared, assumed, provenance label, delimited region, partially probeable,
      instance constant, silent-success hazard, drift report
