# Journey (SSOT) — bootstrapped by DISCUSS wave, feature: edd-loop (2026-07-15)
# Revised by DISCUSS wave, feature: edd-article-alignment (2026-10-27): the steps follow
# Laforgia's EDD protocol (write → hand over → evidence → adversarial review → challenge →
# stabilize → archive); the off-ramp exit is replaced by an opt-out the record names.
# Prior version: git show dc60f44:docs/product/journeys/edd-loop.yaml

id: edd-loop
name: Prove every expectation is met with executed evidence
persona: avery-expectation-owner
job: prove-qualitative-expectations-with-evidence
summary: >
  Avery runs /phil:edd with an intent. The command captures the expectations, checked for
  coverage, size and risk, and asks once whether to trust the tests for the checkable ones.
  It delegates the build to nwave or phil:work, gathers EXECUTED evidence for every expectation
  not opted out, from an agent that is not the builder, and runs an independent adversarial
  review. Avery accepts, rejects or challenges each expectation. Every accepted expectation is
  pinned by a test meeting the plugin's testing standards; the plugin's own review and repair
  skills run over the built code, and their serious findings block done. Expectations, evidence
  and verdicts become a living record whose composed prose meets the plugin's writing standards.

# Research depth: LIGHTWEIGHT — happy path + key error paths.

steps:
  - id: invoke
    action: Avery runs `/phil:edd "<intent>"`
    output: Tool acknowledges the intent and enters CAPTURE
    emotion: uncertain — "the AI will build a lot; will it meet what I meant, fuzzy parts included?"
  - id: capture
    action: >
      Tool restates the intent as discrete expectations, names any missing category (happy path,
      past edge cases, non-functional, must-not-happen), proposes splits for any expectation of
      more than one breath, and orders the list by risk. Its suggestions are labelled composed;
      Avery's wording is kept. Avery confirms, and answers once whether to trust the tests for
      the checkable expectations this run.
    output: risk-ordered expectations list, each labelled checkable / qualitative / not executable in the loop, plus the opt-out answer
    emotion: clarity — the gaps surfaced while they were cheap to fill
  - id: hand-over
    action: >
      Tool delegates the build to one engine (nwave for user-facing, phil:work for invisible),
      unchanged. The engine's own oracle still proves the checkable expectations.
    output: built work; the engine's oracle result
    emotion: trust building — the proven engine does the build
  - id: evidence
    action: >
      For every expectation not opted out, a non-builder producer runs the scenario or renders
      the thing and captures inputs and verbatim output with a reproduce command. Narration —
      "all tests passed", a description, a summary — is rejected. An expectation that cannot be
      run in the loop goes to Avery to spot-check by hand or stop.
    output: per-expectation EXECUTED evidence (raw + reproduce command), or a recorded opt-out or hand spot-check
    emotion: confidence — "I'm looking at what it actually did"
  - id: adversarial-review
    action: >
      An independent adversarial reviewer attacks the built work against the expectations and
      the plugin's standards; a judge confirms or refutes each finding.
    output: confirmed findings, ranked worst-first, each with a span and evidence
    emotion: vigilance — someone tried to break it before I trusted it
  - id: challenge
    action: >
      Per expectation, Avery sees the evidence, the confirmed findings and four challenge
      questions, and answers accept, reject (the engine changes the thing, evidence is
      re-gathered) or challenge (new evidence for a named scenario, no rebuild).
    output: per-expectation verdict, or a challenge that loops back to evidence
    emotion: ownership — the verdict rests on evidence Avery pushed on
  - id: stabilize
    action: >
      Every accepted expectation is pinned by a test meeting rules/testing.md and
      rules/test-patterns.md; an accepted large or subjective output becomes an approval test.
      The plugin's code review runs over the changed code and tests; its serious findings, and a
      UI audit's must-fix findings, block done until fixed or waived by name. The rest are
      offered to the plugin's refactor, test-refactor, test-redesign and comment-cleanup skills.
    output: pinning tests; review findings fixed, waived or declined, each recorded
    emotion: assurance — the standards written down here are the ones applied
  - id: archive
    action: >
      For every run that built, the tool composes the trail and evolution summary, runs the
      plugin's prose review over what it composed, applies the safe fixes to composed words only,
      and writes the record. Evidence and Avery's words are never edited.
    output: docs/edd/<slug>/ (expectations, evidence/, verdicts) + docs/evolution/<date>-<slug>.md
    emotion: satisfaction — a teammate can see what was expected and how we know

emotional_arc: uncertain -> clarity -> trust -> confidence -> vigilance -> ownership -> assurance -> satisfaction  # upward

shared_artifacts:
  - name: expectations_list
    source: capture
    consumed_by: [hand-over, evidence, adversarial-review, challenge, stabilize, archive]
  - name: opt_out
    source: capture
    consumed_by: [evidence, archive]  # the record names every expectation trusted to tests
  - name: executed_evidence_artifacts
    source: evidence
    consumed_by: [challenge, stabilize, archive]  # accepted evidence becomes an approval test's approved output
  - name: confirmed_findings
    source: adversarial-review
    consumed_by: [challenge, archive]
  - name: verdicts
    source: challenge
    consumed_by: [stabilize, archive]
  - name: waivers
    source: [adversarial-review, stabilize, archive]
    consumed_by: [archive]

error_paths:
  - step: capture
    failure: An expectation is marked qualitative without a concrete reason it can't be cheaply asserted
    recovery: Treat it as checkable; it still gets evidence unless opted out
  - step: evidence
    failure: The "evidence" is narration ("all tests passed", a description, a summary)
    recovery: Reject it and re-commission a real executed artifact
  - step: evidence
    failure: The builder and the evidence-producer are the same agent
    recovery: Re-commission from the independent producer — separation of powers is mandatory
  - step: evidence
    failure: The producer cannot run the expectation in the loop
    recovery: Report it to Avery, who spot-checks by hand or stops; the record says which
  - step: adversarial-review
    failure: A confirmed major finding is neither fixed nor waived
    recovery: Block done
  - step: challenge
    failure: Avery rejects or challenges an expectation
    recovery: Reject rebuilds via the engine, then re-gathers evidence; challenge re-gathers only; Avery may stop, and the run is reported not done
  - step: stabilize
    failure: An accepted expectation has no test pinning it, or a serious review finding stands unwaived
    recovery: Block done
  - step: archive
    failure: The prose review would edit evidence or Avery's words
    recovery: Fixes apply to composed words only; evidence stays byte-identical
