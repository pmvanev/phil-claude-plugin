# Journey (SSOT) — bootstrapped by DISCUSS wave, feature: groom-issues (2026-08-12)

id: groom-issues
name: Bring an issue board into shape without guessing
persona: robin-backlog-curator
job: keep-a-backlog-trustworthy
summary: >
  Robin runs the grooming session on a board that has been accumulating. One cheap scan derives a
  defect table fresh — no stored marker is consulted or written — and reports it. Robin scopes what
  to work. Mechanical defects are fixed inside that scope; every cross-issue judgement (merge, split,
  close, group) is presented with evidence and applied only if Robin says so.

steps:
  - id: invoke
    action: Robin runs `/phil:groom-issues` against a board
    output: The board is identified and the scan begins
    emotion: wary — the board has been accumulating and nobody knows how bad it is
  - id: scan
    action: >
      One call per forge fetches every issue with its body, labels and milestone. The defect table is
      derived fresh against the house-default standard; no marker is read, because none exists.
    output: >
      "57 clean, 3 with body defects, 2 duplicate candidates, 1 oversized" — plus the evidence behind
      each finding
    emotion: relief — the size of the problem is known, and it is usually smaller than feared
  - id: scope
    action: >
      Robin picks what to work: a defect class, a subset of issues, or everything. The tool does not
      choose, and does not start fixing to demonstrate progress.
    output: An agreed scope
    emotion: control — the board is not being rewritten out from under me
  - id: fix-mechanical
    action: >
      Inside the agreed scope, apply only the defects that need no judgement — links that would 404,
      accumulated single-valued labels, missing cross-links. Each change is reported as it is made.
    output: Per-issue changes, each stating what changed and why it was safe
    emotion: momentum — the boring half is disappearing without me deciding anything
  - id: elicit-semantic
    # Added by DISCUSS wave, slice 04 (2026-08-13, issue #25). `/phil:groom-ask`.
    action: >
      For a card the scan reported as failing rules 1 or 2, PRESENT the card — what it is, what it
      already says, which rule failed — then ask only for what the scan reported missing, offering a
      suggestion or two Robin can accept, edit or replace. Write the result as a clean card rather than a
      transcript, with a provenance label on every field. One card at a time. A rule that passed is never
      rewritten.
    output: >
      A body Robin sanctioned, each field labelled `you wrote` / `you accepted my suggestion` /
      `you edited my suggestion` / `I rephrased your answer`, with the answer shown beside the written
      form wherever the two differ — or, on a decline, nothing at all and no record that it was offered
    emotion: >
      relief again, of a different kind — the findings I could only look at are now the ones I can
      finish, and I can see exactly which words are mine and which are the tool's
    # Amended 2026-08-14 (scribe → editor). The original required every word to come from Robin and
    # forbade any suggestion. The invariant is swapped, not dropped: what matters is that Robin can SEE
    # what the session contributed, not that it contributed nothing. Verbatim never covered the
    # suggestion path — a session that offered a draft and got a nod satisfied the old rule while
    # producing a body Robin never composed.
  - id: decide-set-level
    action: >
      For each cross-issue candidate — duplicate, oversized, overcome by events, ungrouped — present
      the evidence and ask. Nothing here is applied unasked, because each is expensive to undo.
    output: A decision per candidate; applied or declined, and declined leaves no trace
    emotion: confidence — nothing irreversible happened without me
  - id: report
    action: >
      State what changed, what was declined, and what remains outstanding. A board with nothing wrong
      is reported as clean rather than given manufactured work.
    output: A closing summary; the board itself is the record
    emotion: trust — the board now says what it means

emotional_arc: >
  wary → relief → control → momentum → relief(again) → confidence → trust  # upward
  # The second relief (elicit-semantic) is a different feeling from the first. The first is
  # learning the size of the problem; this one is learning the findings have an exit.

shared_artifacts:
  - name: house_default_body_standard
    source: the skill, overridable per project in CLAUDE.md
    consumed_by: [scan]          # the oracle; without it the defect table is taste
  - name: defect_table
    source: scan                  # re-derived every run, never stored
    consumed_by: [scope, fix-mechanical, report]
  - name: set_level_candidates
    source: scan
    consumed_by: [decide-set-level]
  - name: agreed_scope
    source: scope
    consumed_by: [fix-mechanical, decide-set-level, elicit-semantic]
  - name: elicited_body_content
    source: >
      Robin sanctions it; the session may draft it. Joint, and the provenance label per field is what
      keeps the two distinguishable.
    consumed_by: [elicit-semantic]
    # Amended 2026-08-14. This entry previously read `source: Robin ... # NEVER the session`, on the
    # reasoning that an inferred purpose is indistinguishable from a dictated one once written. That
    # reasoning was right about the HAZARD and wrong about the remedy: indistinguishability is what the
    # provenance label fixes, and forbidding the session to draft also forbade the suggestions that make
    # a title-only card answerable at all. What must never happen is a field written WITHOUT a label, or
    # a suggestion adopted on silence — an unlabelled field is the defect, not a drafted one.
  # DELIBERATELY NOT an artifact: any "groomed" marker — no label, no timestamp block. A stored
  # marker becomes a second authority the moment a human edits a groomed issue, which is what
  # phil:issue-board forbids under "One system of record per scope".

error_paths:
  - step: scan
    failure: The forge is unreachable, or the board is larger than one page
    recovery: >
      Paginate; if the read is still partial, say so and refuse to report "N clean" — a completeness
      claim over a partial read is the one output that actively misleads
  - step: scan
    failure: An issue body contains session state or other scratch
    recovery: >
      Flag it as a body defect. ADR-013 puts session state in a git-ignored local file precisely
      because a board is world-readable
  - step: fix-mechanical
    failure: A fix would edit inside a generated region (e.g. the `nwave:status` block)
    recovery: >
      Refuse. That region is generated, never typed; a hand edit is overwritten at the next refresh
      and disagrees with its source until then
  - step: fix-mechanical
    failure: The issue changed between the scan and the write
    recovery: Re-read before writing, and report the change rather than overwriting it silently
  - step: decide-set-level
    failure: Robin declines a merge, split, close, or grouping
    recovery: >
      Leave the card untouched and record nothing. ACCEPTED COST — because the defect table is
      re-derived every run and no marker is stored, a declined candidate WILL be proposed again next
      run. That is the price of having no second authority; it is not a bug, and the report should
      say so plainly rather than let it read as the tool forgetting
  - step: elicit-semantic
    failure: Robin declines to fill the card in, or cannot answer right now
    recovery: >
      Write nothing and record nothing. Same accepted cost as a declined set-level candidate — the
      finding returns next run, because the defect table is re-derived and D6 stores no marker
  - step: elicit-semantic
    failure: The body changed between the scan and the write
    recovery: >
      Re-read immediately before writing and refuse to overwrite. Same rule as fix-mechanical, and
      it matters more here: the body being replaced is prose a human wrote
  - step: elicit-semantic
    failure: The scan reported only one of rules 1 and 2 as failing
    recovery: >
      Ask only for what was reported missing. Measured 2026-08-14 on the real board: three cards fail
      rule 2 and none fail rule 1, so the observed population is partial rather than empty. Asking for a
      purpose the card already states is ceremony on the answered half, and invites overwriting prose
      that passes
  - step: elicit-semantic
    failure: The body is entirely a generated region, so dictated prose has nowhere legitimate to go
    recovery: >
      Refuse, and hand the elicited answers back. Same rule as fix-mechanical, reached from the other
      side: there the correct content lives at the generator, here it lives nowhere — a purpose is not
      derivable from any artifact, which is why elicitation exists. Writing just outside the markers to
      place the content is the same defect one line over
  - step: elicit-semantic
    failure: Robin's reply is neither an answer nor a decline — "ok", "sure", "sounds right"
    recovery: >
      Treat it as unanswered and ask once more, naming what is still needed. Never resolve the ambiguity
      by composing. Load-bearing since 2026-08-14: with a suggestion on the table, an ambiguous reply
      plausibly reads as ACCEPT, so the misreading now has a concrete draft to adopt — and adopting it
      would produce a body Robin never sanctioned while every visible rule looked satisfied
  - step: elicit-semantic
    failure: A suggestion was offered and Robin said nothing about it
    recovery: >
      Write nothing. A suggestion is adopted only on an explicit accept, edit or replacement; silence is
      not consent, and this is the one path where the tool's own words could reach the card unnoticed
  - step: elicit-semantic
    failure: Robin answers one question but not the other
    recovery: >
      Write what was given and leave the rest. A card with a purpose and no done-condition is a
      smaller defect than one with neither, and inventing the missing half to make the body look
      complete is the exact failure this step exists to avoid
  - step: report
    failure: Nothing is wrong with the board
    recovery: >
      Report it clean and stop. Manufacturing work to justify the run is how a grooming tool teaches
      people to stop running it
