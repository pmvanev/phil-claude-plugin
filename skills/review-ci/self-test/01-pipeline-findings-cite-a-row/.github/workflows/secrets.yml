name: secret-scan

on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d5491e7e7124a22dd73fa746ba129c59f9dc6d5d # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@925fd8fc1e7fb60f87d1dd28aae165d1d091e0d4 # v2.3.7
