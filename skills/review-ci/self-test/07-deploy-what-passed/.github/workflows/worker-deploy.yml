# Deploy the worker once a worker.yml run on main succeeds.
name: worker-deploy

on:
  workflow_run:
    workflows: [worker]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-worker-staging:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/ci/run.sh deploy-worker staging
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

  deploy-worker-production:
    needs: [deploy-worker-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/ci/run.sh deploy-worker production
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
