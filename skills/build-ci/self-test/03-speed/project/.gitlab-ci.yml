# ledger-api: check, build, test, package.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages: [check, build, test, package]

default:
  image: node:24-bookworm@sha256:6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f
  timeout: 20m

gitleaks:
  stage: check
  needs: []
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  script:
    - ./scripts/ci/run.sh secret-scan

lint:
  stage: check
  needs: []
  script:
    - ./scripts/ci/run.sh lint

build:
  stage: build
  needs: []
  script:
    - ./scripts/ci/run.sh build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

test:
  stage: test
  needs: [build]
  script:
    - ./scripts/ci/run.sh test

package:
  stage: package
  needs: [build, test]
  script:
    - ./scripts/ci/run.sh package
  artifacts:
    paths: [out/]
    expire_in: 1 week

release:
  stage: package
  needs: [package]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - ./scripts/ci/run.sh release
